 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Sản phẩm</title>
  <link rel="stylesheet" href="../css/style4.css">
</head>
<body>

<div class="container">
  <table border = "1">
    <caption>Hóa Đơn Mua Hàng</caption>
    <tr> 
      <th>Tên sản phẩm</th>
      <th>Số lượng</th>
      <th>Đơn giá</th>
      <th>Thành tiền</th>
    </tr>
    <tr>
      <td>A</td>
      <td class = "sl">1</td>
      <td class = "dg">1000</td>
      <td class = "tt">1000</td>
    </tr>
    <tr>
      <td>B</td>
      <td class = "sl">2</td>
      <td class = "dg">2000</td>
      <td class = "tt">4000</td>
    </tr>
    <tr>
      <td>C</td>
      <td class = "sl">3</td>
      <td class = "dg">3000</td>
      <td class = "tt">9000</td>
    </tr>
      <tr>
      <td colspan = "3"> Tổng thanh toán</td>
      <td id = "kq">14000</td>
      </tr>
  </table>
</div>
<script>
  const soLuong = document.getElementsByClassName("sl");//list Collection truy xuat
  const donGia = document.getElementsByClassName("dg");
  const thanhTien = document.getElementsByClassName("tt");
  //Duyệt qua mỗi dòng
  for(let i = 0; i<soLuong.length; i++)
  {
    thanhTien[i].innerHTML=soLuong[i].innerHTML * donGia[i].innerHTML;
    tongThanhToan += parseInt(thanhTien[i].innerHTML);
  }
  document.getElementById("kq").innerHTML= tongThanhToan;
</script>
</body>
</html>
